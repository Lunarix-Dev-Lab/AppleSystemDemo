services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sistemaapple}
      POSTGRES_USER: ${POSTGRES_USER:-apple}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apple123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apple} -d ${POSTGRES_DB:-sistemaapple}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-apple}:${POSTGRES_PASSWORD:-apple123}@postgres:5432/${POSTGRES_DB:-sistemaapple}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4000
      API_URL: http://backend:8000
    ports:
      - "4000:4000"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
