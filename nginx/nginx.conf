worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # Logs al stdout/stderr para que docker logs los capture
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:4000;
    }

    server {
        listen 80;
        server_name _;   # acepta cualquier IP o dominio

        # API FastAPI
        location /api/ {
            proxy_pass         http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Imágenes / archivos estáticos servidos por FastAPI
        location /media/ {
            proxy_pass         http://backend/media/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_cache_valid  200 7d;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # Angular SSR (todo lo demás)
        location / {
            proxy_pass         http://frontend/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
