worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # No revelar versión de nginx en headers ni páginas de error
    server_tokens off;

    # Timeouts cortos: clientes lentos (slowloris) no retienen conexiones
    client_body_timeout   12s;
    client_header_timeout 12s;
    send_timeout          10s;

    # Logs al stdout/stderr para que docker logs los capture
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # ── Rate limiting ─────────────────────────────────────────────────────────
    # api:     30 req/s por IP para API (navegación normal usa <5)
    # login:   5 req/min por IP para el login (anti fuerza bruta)
    # general: 50 req/s por IP para el frontend (páginas + assets)
    limit_req_zone $binary_remote_addr zone=api:10m     rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m   rate=5r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;

    # Máx 30 conexiones simultáneas por IP
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # Responder 429 (no el default 503) cuando se excede un límite
    limit_req_status  429;
    limit_conn_status 429;

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:4000;
    }

    server {
        listen 80;
        server_name _;   # acepta cualquier IP o dominio

        limit_conn perip 30;

        # ── Headers de seguridad (en todas las respuestas) ───────────────────
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

        # Login: zona estricta anti fuerza bruta (capa 1; el backend es capa 2)
        location = /api/v1/auth/login {
            limit_req zone=login burst=5 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # API FastAPI
        location /api/ {
            limit_req zone=api burst=40 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Imágenes de productos servidas por FastAPI
        # (solo `expires`, sin add_header: así se heredan los headers de seguridad)
        location /media/ {
            limit_req zone=general burst=100 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            expires 7d;
        }

        # Angular SSR (todo lo demás)
        location / {
            limit_req zone=general burst=100 nodelay;

            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
